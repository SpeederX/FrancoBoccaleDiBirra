name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: tools/agent-service/package-lock.json
      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install agent service dependencies
        run: npm ci --prefix tools/agent-service --no-audit --no-fund
      - name: Build and test native code and agent service
        shell: pwsh
        run: ./scripts/verify.ps1
